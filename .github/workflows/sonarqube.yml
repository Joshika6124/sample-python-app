name: SonarQube Analysis

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches: [ master ]

permissions:
  security-events: write
  checks: write
  pull-requests: write
  contents: read

jobs:
  sonarqube:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch_name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch_name=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
          fi
        id: extract_branch

      - name: Add scanner to PATH
        run: echo "$HOME/sonar-scanner/bin" >> $GITHUB_PATH

      - name: SonarQube Scan
        run: >
          sonar-scanner
          -Dsonar.projectKey=sample_python_github-${{ steps.extract_branch.outputs.branch_name }}
          -Dsonar.projectName="sample-python-app (${{ github.ref_name }})"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Convert SonarQube issues to SARIF
        uses: vmvarela/sonarqube-sarif@v1
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          project-key: sample_python_github-${{ steps.extract_branch.outputs.branch_name }}
          wait-for-processing: false
          processing-delay: 15

      - name: Upload SARIF to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sonarqube.sarif
